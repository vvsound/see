name: build-xview
on:
  push:
  workflow_dispatch:
jobs:
  win:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -A x64
      - name: Build
        run: cmake --build build --config Release
      - name: Collect
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item build/Release/Xview.exe dist/Xview.exe
          Get-Item dist/Xview.exe | Format-List Name,Length
      - uses: actions/upload-artifact@v4
        with:
          name: Xview-win64
          path: dist/Xview.exe
          if-no-files-found: error
