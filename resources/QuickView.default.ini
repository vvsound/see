; QuickView 配置文件。可以用记事本修改,改完重启程序生效。
; 以 ; 开头的是注释。每一项都必须存在,缺项或写错会提示出错的那一行。
; 以 ;@ 开头的行是程序用来检查类型的,请不要改动。


[Browse]
; 浏览窗口是否显示工具栏。1=是 0=否
;@bool
ShowToolbar=1
; 浏览窗口是否显示状态栏
;@bool
ShowStatusBar=1
; 浏览窗口是否显示菜单栏
;@bool
ShowMenu=1
; 浏览窗口是否显示路径栏(地址下拉框)
;@bool
ShowPathBar=1
; 是否显示左侧文件夹树
;@bool
ShowTree=1
; 文件列表里是否显示 .lnk 快捷方式文件(仅在"显示所有文件"或不隐藏非图片时可见)
;@bool
ShowShortcuts=1
; 是否在文件夹树下方显示预览窗格
;@bool
ShowPreview=1
; 缩略图类显示方式下是否隐藏预览窗格
;@bool
HidePreviewInThumbMode=1
; 浏览窗口标题栏是否显示完整路径(否则只显示文件夹名)
;@bool
FullPathInTitle=0
; 退出时记住窗口:None=不记住 Size=只记大小 SizeAndPos=记大小和位置
;@enum None|Size|SizeAndPos
WindowGeometryMode=SizeAndPos
; 启动时是否回到上次浏览的文件夹
;@bool
StartInLastFolder=1
; 是否保存路径栏的历史文件夹
;@bool
SaveRecentFolders=1
; 路径栏历史最多保存几个文件夹
;@int 1 100
RecentFolderCount=20
; 单击已选中的文件名进入重命名
;@bool
SingleClickRename=0
; 在详细列表中双击"描述"列可编辑描述
;@bool
DoubleClickEditDescription=0

[FileList]
; 文件列表是否隐藏扩展名不在图片扩展名列表里的文件
;@bool
HideNonImages=1
; 是否显示带隐藏属性的文件和文件夹
;@bool
ShowHidden=0
; 文件夹树里是否列出本地磁盘
;@bool
ShowLocalDrives=1
; 文件夹和文件是否使用系统图标
;@bool
UseSystemIcons=1
; 详细列表的列宽是否自动适应内容
;@bool
AutoColumnWidth=1
; 详细列表是否显示网格线
;@bool
ShowGrid=0
; 详细列表是否整行高亮选中
;@bool
FullRowSelect=1
; 1=一律用 KB 显示 0=自动选择 B/KB/MB
;@bool
SizeInKB=1
; 详细列表中图片文件用颜色底色标出
;@bool
HighlightImages=1
; 图片文件高亮底色,格式 #RRGGBB
;@color
HighlightColor=#E6F0FF
; 何时读取图片宽高色深:FixedOnly=仅固定磁盘 Always=总是 Never=从不
;@enum FixedOnly|Always|Never
ReadImageInfo=FixedOnly
; 选中图片时自动更新预览窗格
;@bool
PreviewAuto=1
; 选中后等待多少毫秒再更新预览
;@int 0 2000
PreviewDelayMs=200
; 预览窗格的高度(像素)
;@int 80 600
PreviewHeight=200
; 文件夹内容变化时自动刷新列表
;@bool
AutoRefresh=1
; 自动刷新发现新文件时自动选中它
;@bool
AutoSelectNewFiles=0

[Thumbnails]
; 缩略图框的宽度(像素)
;@int 32 256
Width=100
; 缩略图框的高度(像素)
;@int 32 256
Height=100
; 缩略图之间的间距(像素)
;@int 0 30
Border=6
; 是否把缩略图保存到磁盘缓存
;@bool
CacheEnabled=0
; 缓存文件夹;相对路径表示相对于 exe 所在文件夹
;@string
CacheDir=thumbcache
; 缩略图缓存是否用 JPEG 压缩保存
;@bool
CacheCompress=1
; 缩略图下方是否显示文件大小
;@bool
ShowFileSize=0
; 缩略图下方是否显示 宽x高x色深
;@bool
ShowImageArea=1
; 缩略图方式下是否也显示非图片文件
;@bool
ShowAllFiles=0
; 缩略图方式下是否显示子文件夹
;@bool
ShowFolders=1

[Viewer]
; 查看窗口是否显示工具栏
;@bool
ShowToolbar=1
; 查看窗口是否显示状态栏
;@bool
ShowStatusBar=1
; 查看窗口是否显示菜单栏
;@bool
ShowMenu=1
; 查看窗口标题栏是否显示完整路径
;@bool
ShowFullPath=0
; 图片比窗口大时自动缩小
;@bool
ShrinkToWindow=0
; 图片比屏幕大时自动缩小(配合"改变窗口大小到最适合图片")
;@bool
ShrinkToScreen=0
; 图片比窗口小时自动放大
;@bool
EnlargeToWindow=0
; 图片比屏幕小时自动放大(配合"改变窗口大小到最适合图片")
;@bool
EnlargeToScreen=0
; 查看窗口是否总在其他窗口之上
;@bool
AlwaysOnTop=0
; 进入查看窗口时是否全屏
;@bool
Fullscreen=0
; 全屏时鼠标静止一会儿后隐藏光标
;@bool
HideMouseInFullscreen=1
; 换图时窗口自动调整到适合图片的大小
;@bool
AutoResizeWindow=1
; 自动调整窗口大小后是否把窗口放到屏幕中央
;@bool
CenterOnResize=1
; 记住查看窗口的位置和大小
;@bool
SaveWindowPos=1
; 翻页时遍历文件夹中全部图片
;@bool
ViewAllInFolder=1
; 缩放锁定:翻页时保持当前缩放比例,不按"适应窗口"重算(查看窗口右键菜单可切换)
;@bool
ZoomLock=0
; 删除或移动图片后返回浏览窗口
;@bool
ExitAfterDelete=0
; 翻页时前后各预加载几张图片(0=不预加载)
;@int 0 5
PreloadCount=1

[Display]
; 是否对显示的图片做 γ 校正
;@bool
GammaEnabled=0
; γ 校正的数值
;@double 0.30 3.00
Gamma=1.20
; 只显示 GIF 第一帧
;@bool
DisableGifAnimation=0

[Archive]
; NoConfirm=不确认直接进回收站 Confirm=总是要求确认(进回收站) Permanent=不使用回收站(永久删除,会确认)
;@enum NoConfirm|Confirm|Permanent
DeleteMode=Confirm
; Ask=询问 Overwrite=覆盖 Skip=跳过 AutoRename=自动改名
;@enum Ask|Overwrite|Skip|AutoRename
DuplicateAction=Ask
; 目标位置已有内容完全相同的文件时直接跳过
;@bool
SkipIfIdentical=1
; 自动改名时加在文件名与序号之间的字符,如 a_1.jpg
;@string
RenameSeparator=_
; 写出 descript.ion 时是否设为隐藏文件
;@bool
DescriptHidden=1
; descript.ion 使用 OEM(GBK)编码读写而不是 UTF-8
;@bool
DescriptOem=0

[Misc]
; 程序已运行时再次启动文件:Replace=替换列表 AddToList=添加到列表 NewWindow=新窗口
;@enum Replace|AddToList|NewWindow
OnStartFile=AddToList
; 把文件拖进窗口时:Replace=替换列表 Add=添加到列表
;@enum Replace|Add
OnDropFile=Add
; 打印前是否弹出打印对话框
;@bool
PrintShowSetup=1
; 标题栏是否附带版本号
;@bool
TitleShowVersion=0
; 鼠标悬停在按钮上时是否显示提示
;@bool
ShowToolTips=1
; 鼠标悬停在文件上时是否显示文件信息提示
;@bool
ShowInfoTips=1

[Files]
; 图片扩展名列表(逗号分隔,不带点)。可在 工具→管理图片扩展名 里改,也可直接改这里。图片格式按文件内容识别
;@list
Extensions=jpg,jpeg,jfif,jpe,png,gif,bmp,webp,svg,svgz,tif,tiff,ico

