[Mouse]
; 鼠标映射(查看窗口):每个动作对应一个命令 ID
; 滚轮向上(查看窗口)。值可以是任意命令 ID 或 None
;@string
Wheel.Up=PrevImage
; 滚轮向下
;@string
Wheel.Down=NextImage
; Ctrl+滚轮向上
;@string
CtrlWheel.Up=ZoomIn
; Ctrl+滚轮向下
;@string
CtrlWheel.Down=ZoomOut
; 左键拖动。Pan=移动图片 None=无
;@string
LeftDrag=Pan
; 双击
;@string
DoubleClick=BackToBrowser
; 右键。ContextMenu=弹出右键菜单
;@string
RightClick=ContextMenu

[MenuBrowser]
; 浏览窗口菜单栏的菜单顺序(菜单名见下面各项)
;@list
Order=File,Edit,View,Tools,Help
; 浏览窗口"文件"菜单,逗号分隔命令 ID,| 表示分隔线
;@list
File=OpenSelected,OpenFile,|,CopyTo,MoveTo,|,Rename,Delete,Properties,|,Print,|,Exit
; 浏览窗口"编辑"菜单
;@list
Edit=CutFile,CopyFile,CopyImageSel,|,SelectAll,|,EditDescription
; 浏览窗口"视图"菜单
;@list
View=ViewThumbInfo,ViewThumbs,ViewIcons,ViewList,ViewDetails,|,ToggleMenu,ToggleToolbar,ToggleStatusBar,TogglePathBar,ToggleTree,TogglePreview,|,Refresh,GoUp
; 浏览窗口"工具"菜单
;@list
Tools=ManageExtensions,FileAssoc,|,Options
; 浏览窗口"帮助"菜单
;@list
Help=About

[MenuViewer]
; 查看窗口菜单栏的菜单顺序
;@list
Order=File,Edit,View,Zoom,Tools,Help
; 查看窗口"文件"菜单
;@list
File=OpenFile,SaveAs,|,CopyTo,MoveTo,|,Rename,Delete,Properties,|,Print,|,CloseImage,BackToBrowser,Exit
; 查看窗口"编辑"菜单
;@list
Edit=CopyImage,|,RotateLeft,RotateRight,RotateBy
; 查看窗口"视图"菜单
;@list
View=FirstImage,PrevImage,NextImage,LastImage,|,ReloadImage,Fullscreen,AlwaysOnTop,|,ToggleMenu,ToggleToolbar,ToggleStatusBar
; 查看窗口"缩放"菜单
;@list
Zoom=ZoomIn,ZoomOut,|,FitWindow,ActualSize,ZoomLock
; 查看窗口"工具"菜单
;@list
Tools=ManageExtensions,FileAssoc,|,Options
; 查看窗口"帮助"菜单
;@list
Help=About

[ContextMenu]
; 浏览窗口右键菜单
;@list
Browser=OpenSelected,|,Print,|,CutFile,CopyFile,CopyImageSel,|,CopyTo,MoveTo,Delete,|,Rename,EditDescription,Properties
; 查看窗口右键菜单
;@list
Viewer=NextImage,PrevImage,|,ZoomIn,ZoomOut,ActualSize,FitWindow,ZoomLock,|,ReloadImage,Fullscreen,|,OpenFile,SaveAs,CloseImage,Print,|,RotateBy,Options,|,About,BackToBrowser,|,Exit

[Toolbar]
; 浏览窗口工具栏按钮(命令 ID,| 为分隔线)。想删按钮就删掉对应 ID
;@list
Browser=GoUp,Refresh,|,CopyFile,CopyTo,MoveTo,Delete,Rename,Properties,|,Options,ManageExtensions,|,ViewThumbInfo,ViewThumbs,ViewIcons,ViewList,ViewDetails
; 查看窗口工具栏按钮
;@list
Viewer=BackToBrowser,|,FirstImage,PrevImage,NextImage,LastImage,|,ZoomIn,ZoomOut,FitWindow,ActualSize,|,RotateLeft,RotateRight,|,CopyImage,Print,Delete,|,Fullscreen,Options
