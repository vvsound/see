; 查看窗口"视图"菜单
;@list
View=FirstImage,PrevImage,NextImage,LastImage,|,PrevFolder,NextFolder,|,ReloadImage,Fullscreen,AlwaysOnTop,|,ToggleMenu,ToggleToolbar,ToggleStatusBar,ToggleKeyHints
; 查看窗口"缩放"菜单
;@list
Zoom=ZoomIn,ZoomOut,|,FitWindow,ActualSize,ZoomLock
; 查看窗口"工具"菜单
;@list
Tools=ManageExtensions,FileAssoc,|,Options
; 查看窗口"帮助"菜单
;@list
Help=About

[ContextMenu]
; 浏览窗口右键菜单
;@list
Browser=OpenSelected,|,Print,|,CutFile,CopyFile,CopyImageSel,|,CopyTo,MoveTo,Delete,|,Rename,EditDescription,Properties
; 查看窗口右键菜单
;@list
Viewer=NextImage,PrevImage,|,ZoomIn,ZoomOut,ActualSize,FitWindow,ZoomLock,|,ReloadImage,Fullscreen,|,OpenFile,SaveAs,CloseImage,Print,|,RotateBy,Options,|,About,BackToBrowser,|,Exit

[Toolbar]
; 工具栏图标边长(像素)
;@int 12 64
IconSize=20
; 浏览窗口工具栏按钮(命令 ID,| 为分隔线;@PathBar=把路径栏放在这个位置并占满剩余宽度;@Stretch=可拉伸空白)。想删按钮就删掉对应 ID
;@list
Browser=HistoryBack,HistoryForward,GoUp,Refresh,|,@PathBar,|,CopyFile,CopyTo,MoveTo,Delete,Rename,|,ThumbSmaller,ThumbBigger,|,ToggleInfo,Options
; 查看窗口工具栏按钮
;@list
Viewer=BackToBrowser,|,FirstImage,PrevImage,NextImage,LastImage,|,ZoomIn,ZoomOut,FitWindow,ActualSize,|,RotateLeft,RotateRight,|,CopyImage,Print,Delete,|,Fullscreen,Options

[StatusBar]
; 状态栏各字段是否画凹陷边框(0=扁平,B 界面风格;1=传统凹陷框)。改完重启生效
;@bool
Frames=0
; 浏览窗口状态栏“总计”格的最小宽度(像素)
;@int 0 800
BrowserTotalWidth=170
; 浏览窗口状态栏“选中大小和时间”格的最小宽度(像素)
;@int 0 800
BrowserSelectionWidth=190
; 浏览窗口状态栏“图片信息”格的最小宽度(像素)
;@int 0 800
BrowserImageInfoWidth=190
; 查看窗口状态栏“序号”格的最小宽度(像素)
;@int 0 800
ViewerIndexWidth=70
; 查看窗口状态栏“文件大小”格的最小宽度(像素)
;@int 0 800
ViewerSizeWidth=80
; 查看窗口状态栏“图片信息”格的最小宽度(像素)
;@int 0 800
ViewerImageInfoWidth=190
; 查看窗口状态栏“缩放比例”格的最小宽度(像素)
;@int 0 800
ViewerZoomWidth=60
; 查看窗口状态栏“载入时间”格的最小宽度(像素)
;@int 0 800
ViewerLoadTimeWidth=110

[Icons]
; 图标是否按主题的 icon 颜色重新着色(0=原样显示图标文件自带的颜色;深色主题请保持 1)。改完重启生效
;@bool
Tint=1
