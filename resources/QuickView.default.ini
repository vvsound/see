; QuickView 配置文件。可以用记事本修改,改完重启程序生效。
; 以 ; 开头的是注释。每一项都必须存在,缺项或写错会提示出错的那一行。
; 以 ;@ 开头的行是程序用来检查类型的,请不要改动。


[Browse]
; 浏览窗口是否显示工具栏。1=是 0=否
;@bool
ShowToolbar=1
; 缩略图/列表最左一列(或列表方式)按 ← 时,回到左侧文件夹树。1=是 0=否。整个流程只靠方向键+回车+空格
;@bool
LeftToTree=1
; 文件夹树里,当前文件夹没有子文件夹时按 → ,直接载入并进入缩略图区。1=是 0=否
;@bool
RightToFiles=1
; 浏览窗口是否显示状态栏
;@bool
ShowStatusBar=1
; 浏览窗口是否显示菜单栏
;@bool
ShowMenu=1
; 浏览窗口是否显示路径栏(地址下拉框)
;@bool
ShowPathBar=1
; 是否显示左侧文件夹树
;@bool
ShowTree=1
; 文件列表里是否显示 .lnk 快捷方式文件(仅在"显示所有文件"或不隐藏非图片时可见)
;@bool
ShowShortcuts=1
; 是否显示右侧信息面板(预览、基本信息、EXIF、直方图;I 键可随时开关)
;@bool
ShowInfoPanel=1
; 是否在文件夹树下方显示预览窗格
;@bool
ShowPreview=1
; 缩略图类显示方式下是否隐藏预览窗格
;@bool
HidePreviewInThumbMode=1
; 浏览窗口标题栏是否显示完整路径(否则只显示文件夹名)
;@bool
FullPathInTitle=0
; 退出时记住窗口:None=不记住 Size=只记大小 SizeAndPos=记大小和位置
;@enum None|Size|SizeAndPos
WindowGeometryMode=SizeAndPos
; 启动时是否回到上次浏览的文件夹
;@bool
StartInLastFolder=1
; 是否保存路径栏的历史文件夹
;@bool
SaveRecentFolders=1
; 路径栏历史最多保存几个文件夹
;@int 1 100
RecentFolderCount=20
; 单击已选中的文件名进入重命名
;@bool
SingleClickRename=0
; 在详细列表中双击"描述"列可编辑描述
;@bool
DoubleClickEditDescription=0

; 浏览窗口状态栏左侧是否显示按键提示(F1 可随时开关)
;@bool
ShowKeyHints=1
; 键盘焦点所在区域(文件夹树/文件区/路径栏)是否画焦点框(颜色见主题)
;@bool
FocusFrame=1
; 在文件夹树里用键盘上下移动后,等多少毫秒再载入该目录(0=立刻;按住方向键快速经过的目录不会载入)
;@int 0 5000
TreeLoadDelayMs=250
; 目录历史(Alt+←/Alt+→)最多记多少步
;@int 1 1000
HistoryCount=100
; 记住多少个文件夹上次选中的文件(再次进入时恢复;0=不记)
;@int 0 10000
PositionMemoryCount=200
; 进入没有记忆的文件夹时,是否自动选中第一项
;@bool
EnterSelectFirst=1
; 文件夹内容变化后,等多少毫秒再自动刷新文件列表(防止连续变化时反复刷新)
;@int 0 10000
AutoRefreshDelayMs=300

[FileList]
; 文件列表是否隐藏扩展名不在图片扩展名列表里的文件
;@bool
HideNonImages=1
; 是否显示带隐藏属性的文件和文件夹
;@bool
ShowHidden=0
; 文件夹树里是否列出本地磁盘
;@bool
ShowLocalDrives=1
; 文件夹和文件是否使用系统图标
;@bool
UseSystemIcons=1
; 详细列表的列宽是否自动适应内容
;@bool
AutoColumnWidth=1
; 详细列表是否显示网格线
;@bool
ShowGrid=0
; 详细列表是否整行高亮选中
;@bool
FullRowSelect=1
; 1=一律用 KB 显示 0=自动选择 B/KB/MB
;@bool
SizeInKB=1
; 详细列表中图片文件用颜色底色标出
;@bool
HighlightImages=1
; 图片文件高亮底色,格式 #RRGGBB
;@color
HighlightColor=#E6F0FF
; 何时读取图片宽高色深:FixedOnly=仅固定磁盘 Always=总是 Never=从不
;@enum FixedOnly|Always|Never
ReadImageInfo=FixedOnly
; 选中图片时自动更新预览窗格
;@bool
PreviewAuto=1
; 选中后等待多少毫秒再更新预览
;@int 0 2000
PreviewDelayMs=200
; 预览窗格的高度(像素)
;@int 80 600
PreviewHeight=200
; 文件夹内容变化时自动刷新列表
;@bool
AutoRefresh=1
; 自动刷新发现新文件时自动选中它
;@bool
AutoSelectNewFiles=0

[Thumbnails]
; 缩略图框的宽度(像素)
;@int 32 256
Width=100
; 缩略图框的高度(像素)
;@int 32 256
Height=100
; 按 + / - 或 Ctrl+滚轮时,缩略图每次放大/缩小多少像素
;@int 4 128
SizeStep=16
; 恢复默认缩略图大小(Ctrl+0)时用的边长(像素),要在 MinSize~MaxSize 之间
;@int
DefaultSize=100
; 缩略图最小边长(像素)
;@int 32 256
MinSize=32
; 缩略图最大边长(像素)
;@int 32 256
MaxSize=256
; 缩略图之间的间距(像素)
;@int 0 30
Border=6
; 缩略图选中/悬停格的圆角(像素,0=直角)
;@int 0 40
CellRadius=8
; 缩略图图片本身的圆角(像素,0=直角)
;@int 0 40
ImageRadius=4
; 缩略图图片外是否画一圈细边框(颜色取主题 border)
;@bool
ImageBorder=0
; 鼠标悬停的格子是否有底色(颜色取主题 hover)
;@bool
HoverHighlight=1
; 键盘焦点所在格的框线粗细(像素,0=不画;颜色取主题 focus)
;@int 0 6
FocusWidth=2
; 是否把缩略图保存到磁盘缓存
;@bool
CacheEnabled=0
; 缓存文件夹;相对路径表示相对于 exe 所在文件夹
;@string
CacheDir=thumbcache
; 缩略图缓存是否用 JPEG 压缩保存
;@bool
CacheCompress=1
; 缩略图下方是否显示文件大小
;@bool
ShowFileSize=0
; 缩略图下方是否显示 宽x高x色深
;@bool
ShowImageArea=1
; 缩略图方式下是否也显示非图片文件
;@bool
ShowAllFiles=0
; 缩略图方式下是否显示子文件夹
;@bool
ShowFolders=1

[Info]
; 信息面板的宽度(像素,启动时的初始值;可以拖动分隔条调整)
;@int 150 800
PanelWidth=270
; 信息面板里是否显示大预览图
;@bool
ShowPreview=1
; 信息面板里预览图的高度(像素)
;@int 60 800
PreviewHeight=200
; 是否显示基本信息
;@bool
ShowBasic=1
; 基本信息显示哪些项、什么顺序:Name 文件名 / Dimensions 尺寸和色深 / Format 格式 / Size 文件大小 / Modified 修改时间 / Path 所在文件夹
;@list
BasicFields=Name,Dimensions,Size,Modified
; 是否显示 EXIF(目前只读 JPEG;读不到就如实显示为空,出错会写明原因)
;@bool
ShowExif=1
; EXIF 显示哪些项、什么顺序:Camera 相机 / Lens 镜头 / Exposure 快门 / Aperture 光圈 / ISO / FocalLength 焦距 / ExposureBias 曝光补偿 / TakenDate 拍摄时间 / Software 软件 / Orientation 方向
;@list
ExifFields=Camera,Lens,Exposure,Aperture,ISO,FocalLength,TakenDate
; 是否显示直方图(按预览图统计 R/G/B 和亮度)
;@bool
ShowHistogram=1
; 直方图的高度(像素)
;@int 40 400
HistogramHeight=90
; 预览读取失败时错误文字的颜色,格式 #RRGGBB
;@color
PreviewErrorColor=#B42828
; 直方图红色通道的颜色,格式 #RRGGBB
;@color
HistogramRed=#E64646
; 直方图绿色通道的颜色,格式 #RRGGBB
;@color
HistogramGreen=#46C85A
; 直方图蓝色通道的颜色,格式 #RRGGBB
;@color
HistogramBlue=#5082F0
; 直方图彩色区域的不透明度(0=全透明 255=不透明)
;@int 0 255
HistogramAlpha=120

[Filter]
; 中栏顶部的筛选条(扩展名标签、排序、网格/列表切换)是否显示。关闭后筛选自动回到"全部"
;@bool
ShowBar=1
; 筛选条上是否显示排序下拉框和方向按钮
;@bool
ShowSort=1
; 筛选条上是否显示 网格/列表 切换按钮
;@bool
ShowViewToggle=1
; 标签上是否显示该类文件的数量
;@bool
ShowCounts=1
; 最多显示几个扩展名标签(按文件数从多到少取)
;@int 1 30
MaxTags=6
; 超出上限的扩展名:开=合并成一个"其他"标签 关=不显示
;@bool
GroupOthers=1
; 标签上扩展名的大小写:Upper=大写 Lower=小写
;@enum Upper|Lower
TagCase=Upper
; 进入另一个文件夹时筛选是否回到"全部"(关=尽量保持当前标签)
;@bool
ResetOnFolderChange=1
; 排序下拉框里有哪些排序依据、什么顺序:Name 名称 / Size 大小 / Date 日期 / Type 类型
;@list
SortKeys=Name,Size,Date,Type
; 点"网格"按钮时切到哪种显示方式:ThumbInfo=缩略图+信息 Thumbs=仅缩略图 Icons=图标
;@enum ThumbInfo|Thumbs|Icons
GridMode=ThumbInfo
; 点"列表"按钮时切到哪种显示方式:List=列表 Details=详细
;@enum List|Details
ListMode=Details

[Viewer]
; 查看窗口是否显示工具栏
;@bool
ShowToolbar=1
; 查看窗口是否显示状态栏
;@bool
ShowStatusBar=1
; 查看窗口是否显示菜单栏
;@bool
ShowMenu=1
; 查看窗口标题栏是否显示完整路径
;@bool
ShowFullPath=0
; 图片比窗口大时自动缩小
;@bool
ShrinkToWindow=1
; 图片比屏幕大时自动缩小(配合"改变窗口大小到最适合图片")
;@bool
ShrinkToScreen=1
; 图片比窗口小时自动放大
;@bool
EnlargeToWindow=1
; 图片比屏幕小时自动放大(配合"改变窗口大小到最适合图片")
;@bool
EnlargeToScreen=1
; 查看窗口是否总在其他窗口之上
;@bool
AlwaysOnTop=0
; 进入查看窗口时是否全屏
;@bool
Fullscreen=0
; 全屏时鼠标静止一会儿后隐藏光标
;@bool
HideMouseInFullscreen=1
; 换图时窗口自动调整到适合图片的大小
;@bool
AutoResizeWindow=1
; 自动调整窗口大小后是否把窗口放到屏幕中央
;@bool
CenterOnResize=1
; 记住查看窗口的位置和大小
;@bool
SaveWindowPos=1
; 翻页时遍历文件夹中全部图片
;@bool
ViewAllInFolder=1
; 缩放锁定:翻页时保持当前缩放比例,不按"适应窗口"重算(查看窗口右键菜单可切换)
;@bool
ZoomLock=0
; 删除或移动图片后返回浏览窗口
;@bool
ExitAfterDelete=0
; 翻页到最后一张再往后时是否回到第一张(第一张往前则到最后一张)
;@bool
Wrap=1
; 图片放大到比窗口大时,方向键是否改为平移图片(关闭则方向键始终翻页;空格/PageUp/PageDown 一直是翻页)
;@bool
ArrowPan=1
; 方向键每次平移多少像素
;@int 10 2000
PanStep=120
; 连续翻页时,停下多少毫秒后才解码新图(按住方向键时中间的图不解码;0=每张都立刻解码)
;@int 0 1000
FlipDecodeDelayMs=60
; 查看窗口状态栏左侧是否显示按键提示(F1 可随时开关)
;@bool
ShowKeyHints=1
; 翻页时前后各预加载几张图片(0=不预加载)
;@int 0 5
PreloadCount=1
; 放大/缩小一档的倍率(按钮、快捷键、Ctrl+滚轮都用它;越大每档变化越多)
;@double 1.01 4.00
ZoomStep=1.25
; 缩放的最小倍数(0.01=1%)
;@double 0.001 1.00
ZoomMin=0.01
; 缩放的最大倍数(64=6400%)
;@double 1.00 500.00
ZoomMax=64.00
; 查看窗口背景色,格式 #RRGGBB
;@color
BackgroundColor=#202020
; 图片读取失败时,查看窗口里错误文字的颜色,格式 #RRGGBB
;@color
ErrorTextColor=#FFA0A0
; 全屏时鼠标不动多少毫秒后隐藏指针(需开启“全屏时隐藏鼠标”)
;@int 200 60000
HideMouseDelayMs=2000

[Display]
; 是否对显示的图片做 γ 校正
;@bool
GammaEnabled=0
; γ 校正的数值
;@double 0.30 3.00
Gamma=1.20
; 只显示 GIF 第一帧
;@bool
DisableGifAnimation=0
; Windows 标题栏深浅:Auto=跟随主题背景色 On=始终深色 Off=始终浅色(重启生效;非 Windows 无效)
;@enum Auto|On|Off
DarkTitleBar=Auto

[Archive]
; NoConfirm=不确认直接进回收站 Confirm=总是要求确认(进回收站) Permanent=不使用回收站(永久删除,会确认)
;@enum NoConfirm|Confirm|Permanent
DeleteMode=Confirm
; Ask=询问 Overwrite=覆盖 Skip=跳过 AutoRename=自动改名
;@enum Ask|Overwrite|Skip|AutoRename
DuplicateAction=Ask
; 目标位置已有内容完全相同的文件时直接跳过
;@bool
SkipIfIdentical=1
; 自动改名时加在文件名与序号之间的字符,如 a_1.jpg
;@string
RenameSeparator=_
; 写出 descript.ion 时是否设为隐藏文件
;@bool
DescriptHidden=1
; descript.ion 使用 OEM(GBK)编码读写而不是 UTF-8
;@bool
DescriptOem=0

[Misc]
; 程序已运行时再次启动文件:Replace=替换列表 AddToList=添加到列表 NewWindow=新窗口
;@enum Replace|AddToList|NewWindow
OnStartFile=AddToList
; 把文件拖进窗口时:Replace=替换列表 Add=添加到列表
;@enum Replace|Add
OnDropFile=Add
; 打印前是否弹出打印对话框
;@bool
PrintShowSetup=1
; 标题栏是否附带版本号
;@bool
TitleShowVersion=0
; 鼠标悬停在按钮上时是否显示提示
;@bool
ShowToolTips=1
; 鼠标悬停在文件上时是否显示文件信息提示
;@bool
ShowInfoTips=1

