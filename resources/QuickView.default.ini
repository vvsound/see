;@list
Order=File,Edit,View,Zoom,Tools,Help
; 查看窗口"文件"菜单
;@list
File=OpenFile,SaveAs,|,CopyTo,MoveTo,|,Rename,Delete,Properties,|,ShowInExplorer,SetWallpaper,|,Print,|,CloseImage,BackToBrowser,Exit
; 查看窗口"编辑"菜单
